<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>*{box-sizing:border-box}body{margin:0}</style>
<title>NOCTILE 図鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+1p:wght@400;500;700&display=swap">
<style>
/* 夜の城の台帳: 上にタブと絞り込み、下に一覧表。ドット文字は名前と見出しだけ */
:root {
  --bg: #e9ecf2; --panel: #f7f8fb; --fg: #1d2030; --dim: #5d6378; --line: #c9cedb;
  --gold: #8a6414; --blood: #a3283a;

  --display: "DotGothic16", "MS Gothic", monospace;
  --body: "M PLUS 1p", "Hiragino Sans", "Yu Gothic", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c0e16; --panel: #141826; --fg: #e9e3d3; --dim: #9096aa; --line: #262c40;
  --gold: #d9aa4c; --blood: #d0505e;
  --k-atk: #e0636c; --k-def: #6aa3e0; --k-sup: #5fc488; --k-mov: #4fc2bf; --k-brk: #e0a83a; --k-ctl: #a985e0;
  --cell-own: #1b2030; --cell-foe: #2b1519; --cell-path: #476fa8; --cell-move: #63e08f; --cell-obj: #cca35a; --cell-hit: #ff7352; --cell-self: #80e0ff;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c0e16; --panel: #141826; --fg: #e9e3d3; --dim: #9096aa; --line: #262c40;
  --gold: #d9aa4c; --blood: #d0505e;
  --k-atk: #e0636c; --k-def: #6aa3e0; --k-sup: #5fc488; --k-mov: #4fc2bf; --k-brk: #e0a83a; --k-ctl: #a985e0;
  --cell-own: #1b2030; --cell-foe: #2b1519; --cell-path: #476fa8; --cell-move: #63e08f; --cell-obj: #cca35a; --cell-hit: #ff7352; --cell-self: #80e0ff;
  color-scheme: dark; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); line-height: 1.6; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; display: grid; gap: 18px; }
header { display: grid; gap: 6px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(1.7rem, 4vw, 2.4rem); letter-spacing: .06em; margin: 0; text-wrap: balance; }
h1 small { color: var(--gold); font-size: .55em; margin-left: .6em; letter-spacing: .1em; }
.lead { color: var(--dim); margin: 0; max-width: 70ch; font-size: .92rem; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { font: inherit; font-family: var(--display); font-size: 1.05rem; letter-spacing: .06em; padding: 6px 16px 8px; background: none; color: var(--dim); border: 1px solid transparent; border-bottom: none; border-radius: 2px 2px 0 0; cursor: pointer; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--gold); background: var(--panel); border-color: var(--line); border-bottom: 1px solid var(--panel); }
.tabs button span { font-family: var(--body); font-size: .75rem; margin-left: 6px; font-variant-numeric: tabular-nums; }
.tabs button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.filters { display: grid; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row .lab { font-size: .75rem; color: var(--dim); letter-spacing: .08em; width: 4.2em; }
button.chip { font: inherit; font-size: .85rem; padding: 3px 11px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 2px; cursor: pointer; }
button.chip[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); box-shadow: inset 0 -2px 0 var(--gold); }
button.chip:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
input[type="search"] { font: inherit; font-size: .9rem; padding: 5px 10px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 2px; min-width: 0; flex: 1 1 220px; max-width: 360px; }
.count { font-size: .8rem; color: var(--dim); font-variant-numeric: tabular-nums; }
.tablebox { overflow-x: auto; border: 1px solid var(--line); background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
table.wide { min-width: 860px; }
th { text-align: left; font-weight: 500; font-size: .74rem; letter-spacing: .08em; color: var(--dim); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.grp td { background: var(--bg); font-family: var(--display); font-size: 1.05rem; color: var(--gold); padding-block: 10px 6px; letter-spacing: .08em; }
td.num { font-variant-numeric: tabular-nums; text-align: center; white-space: nowrap; }
td.nm { white-space: nowrap; }
.nm b { font-family: var(--display); font-weight: 400; font-size: 1rem; }
.tag { display: inline-block; font-size: .68rem; padding: 0 5px; margin-left: 6px; border: 1px solid currentColor; border-radius: 2px; vertical-align: 2px; }
.tag.st { color: var(--gold); } .tag.co { color: var(--k-mov); }
.kind { font-size: .8rem; font-weight: 700; white-space: nowrap; }
.k-攻撃 { color: var(--k-atk); } .k-防御 { color: var(--k-def); } .k-補助 { color: var(--k-sup); }
.k-移動 { color: var(--k-mov); } .k-崩し { color: var(--k-brk); } .k-妨害 { color: var(--k-ctl); }
.rar { font-size: .78rem; color: var(--dim); white-space: nowrap; }
.rar.r2 { color: var(--blood); font-weight: 700; } .rar.r1 { color: var(--gold); }
.desc { min-width: 22em; }
.up { display: block; font-size: .78rem; color: var(--dim); margin-top: 2px; }
.brk { color: var(--k-brk); font-weight: 700; }
.gold { color: var(--gold); }
.zero { color: var(--line); }
.empty { padding: 28px; text-align: center; color: var(--dim); }
.rg { display: grid; grid-template-columns: repeat(5, 7px) 3px repeat(5, 7px); grid-auto-rows: 7px; gap: 1px; padding: 3px; border: 1px solid var(--line); width: max-content; }
.rg i { display: block; background: var(--cell-own); }
.rg i.f { background: var(--cell-foe); } .rg i.sp { background: none; }
.rg i.p { background: var(--cell-path); } .rg i.m { background: var(--cell-move); } .rg i.o { background: var(--cell-obj); }
.rg i.h { background: var(--cell-hit); } .rg i.s { background: var(--cell-self); }
footer { font-size: .78rem; color: var(--dim); }
@media (max-width: 640px) { .row .lab { width: 100%; } }
</style>

</head>

<div class="wrap">
  <header>
    <h1>図鑑<small>NOCTILE</small></h1>
    <p class="lead" id="lead"></p>
  </header>

  <div class="tabs" role="tablist" id="tabs"></div>

  <div class="filters">

    <div class="row"><span class="lab">検索</span><input type="search" id="q" placeholder="名前・効果の言葉で探す（例: 押し出し、氷結）"><span class="count" id="count"></span></div>
  </div>

  <div class="tablebox">
    <table id="tbl">
      <thead id="th"></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
  <footer id="foot"></footer>
</div>

  const isSkill = tab.id === "skills";
  document.getElementById("f-owner").hidden = !isSkill;
  document.getElementById("f-kind").hidden = !isSkill;
  document.getElementById("f-rar").hidden = isSkill;
  document.getElementById("tbl").className = isSkill ? "wide" : "";
  const q = st.q.trim();
  const all = DATA[tab.id];
  const tb = document.getElementById("tb");
  let html = "", n = 0;
  if (isSkill) {
    document.getElementById("th").innerHTML = "<tr><th>名前</th><th>種類</th><th>レア度</th><th>コスト</th><th>再使用</th><th>ブレイク</th><th>範囲</th><th>効果</th></tr>";
    const list = all.filter(r => (st.owner === "すべて" || r.o === st.owner) && (st.kind === "すべて" || r.k === st.kind)
      && (!q || r.n.includes(q) || r.d.includes(q) || r.u.includes(q)));
    n = list.length;
    let last = "";
    for (const r of list) {
      if (r.o !== last) { last = r.o; html += `<tr class="grp"><td colspan="8">${r.o === "共通" ? "共通（誰でも覚えられる）" : esc(r.o)}</td></tr>`; }
      const tags = (r.s ? '<span class="tag st">初期</span>' : "") + (r.co ? '<span class="tag co">協力</span>' : "");
      html += `<tr><td class="nm"><b>${esc(r.n)}</b>${tags}</td>`
        + `<td><span class="kind k-${r.k}">${esc(r.k)}</span></td>`
        + `<td>${rarHtml(r.r)}</td>`
        + `<td class="num">${r.c}</td><td class="num">${esc(r.cd)}</td>`
        + `<td class="num">${r.b ? '<span class="brk">◆' + r.b + "</span>" : '<span class="zero">—</span>'}</td>`
        + `<td>${rangeHtml(r.rg)}</td>`
        + `<td class="desc">${esc(r.d)}${r.u ? '<span class="up">強化: ' + esc(r.u) + "</span>" : ""}</td></tr>`;
    }
    if (!html) html = '<tr><td colspan="8" class="empty">条件に合うスキルはありません。キャラや種類を「すべて」に戻すか、別の言葉で探してください。</td></tr>';
  } else {
    document.getElementById("th").innerHTML = "<tr><th>名前</th><th>レア度</th><th>価格</th><th>効果</th></tr>";
    const list = all.filter(r => (st.rar === "すべて" || r.r === st.rar) && (!q || r.n.includes(q) || r.d.includes(q)));
    n = list.length;
    for (const r of list) {
      html += `<tr><td class="nm"><b>${esc(r.n)}</b></td><td>${rarHtml(r.r)}</td>`
        + `<td class="num"><span class="gold">${r.p} G</span></td><td class="desc">${esc(r.d)}</td></tr>`;
    }
    if (!html) html = '<tr><td colspan="4" class="empty">条件に合うものはありません。レア度を「すべて」に戻すか、別の言葉で探してください。</td></tr>';
  }
  tb.innerHTML = html;
  document.getElementById("count").textContent = n + " / " + all.length + " 件";
}
tabs();
chips("f-owner", OWNERS, "owner");
chips("f-kind", KINDS, "kind");
chips("f-rar", RARS, "rar");
document.getElementById("q").addEventListener("input", e => { st.q = e.target.value; render(); });
render();
</script>
</body>
</html>
